version: '3'

services:
  # Layanan database MongoDB
  item-db:
    image: mongo:3
    volumes:
      - app-db:/data/db
    # Restart Policy
    restart: always
  
  # Layanan aplikasi Node.js
  item-app:
    image: ardidafa/item-app:v1
    ports:
      - "80:8080"
    depends_on:
      - item-db
    # Restart Policy
    restart: always

# Definisi volume untuk penyimpanan data permanen
volumes:
  app-db: